using_extractor: "dino" #  Which feature extractor [simclr_v2, dino, plip, None] 
method: "milr" # Which miml method to use [brknn, cknn, dsmil, fastmiml, milr, misvm, mlknn]
trainset_path: "datasets/diffinfinite_tr1/"
testset_path: "datasets/diffinfinite_tr2/"
checkpoint_path: "checkpoints/"

extractors:
  simclr_v2:
      version_id: "r50_1x_sk0"
      num_labels: 1000
      versions:
        r50_1x_sk0:
          dimensionality: 100
        r101_1x_sk0:
          dimensionality: 100

  dino:
      version_id: "vit_small" # [resnet50 (test with synthetical dataset), vit_small, vit_base]
      custom_weights: True # Only for vit_small
      num_labels: 1000
      patch_size: 16

      versions:
        resnet50:
          dimensionality: 2048
          avgpool_patchtokens: False
          n_last_blocks: 4

        vit_base:
          dimensionality: 768
          avgpool_patchtokens: True
          n_last_blocks: 1

        vit_small:
          dimensionality: 384
          avgpool_patchtokens: False
          n_last_blocks: 4


miml_methods:
  brknn:
      k: 5
      epoch: 40
  cknn:
      epoch: 5
      folds: 10
  dsmil:
      lr: 0.0002
      n_epochs: 40
      weight_decay: 0.00005
      num_workers: 10
      num_classes: 5
      loss: "BCE" #BCE or focal
  fastmiml:
      D: 100
      norm_up: 10
      maxiter: 10
      step_size: 0.005
      lambda_reg: 0.00001
      num_sub: 5
      epoch: 10
  milr:
    epoch: 40
    lr: 0.000001
  misvm:
    restarts: 0
    max_iters: 50
    epoch: 40
    C: 1
    kernel: "linear"
  mlknn:
      epoch: 40